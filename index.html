<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockpit AskHR + Linha do Tempo | Sonova Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rufina:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
  :root{
    --blue:#0083CA;--navy:#003C64;--teal:#005A64;--lightblue:#6EB4DC;
    --wine:#7D0041;--rust:#8C321E;--text:#333333;--text2:#646464;
    --border:#CCCCCC;--bg:#FFFFFF;--bg-soft:#F5F7F9;
    --done:#2E7D32;--done-dk:#1B5E20;--warn:#B8860B;--late:#8C321E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Roboto',Arial,sans-serif;font-weight:300;color:var(--text);
    background:var(--bg-soft);-webkit-font-smoothing:antialiased;line-height:1.45}
  h1,h2,h3,.rufina{font-family:'Rufina',Georgia,serif}

  /* HEADER */
  header.topbar{background:var(--blue);color:#fff;padding:12px 26px;display:flex;
    align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    box-shadow:0 2px 6px rgba(0,0,0,.12);position:sticky;top:0;z-index:60}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .logo{width:40px;height:40px;border:2px solid #fff;border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-family:'Rufina',serif;font-weight:700;font-size:18px;flex:none}
  .brand h1{font-size:19px;font-weight:700;letter-spacing:.3px;line-height:1.1}
  .brand .sub{font-size:11px;font-weight:300;opacity:.92;letter-spacing:.4px;text-transform:uppercase}
  .lang-switch{display:flex;border:1px solid rgba(255,255,255,.55);border-radius:5px;overflow:hidden}
  .lang-switch button{background:transparent;color:#fff;border:none;padding:6px 12px;
    font-family:'Roboto';font-size:12px;font-weight:400;cursor:pointer;letter-spacing:.5px}
  .lang-switch button.active{background:#fff;color:var(--blue);font-weight:500}

  /* NAV TABS */
  nav.tabs{background:var(--navy);display:flex;gap:0;padding:0 26px;position:sticky;top:64px;z-index:55;flex-wrap:wrap}
  nav.tabs button{background:transparent;border:none;color:rgba(255,255,255,.78);
    font-family:'Roboto';font-size:13.5px;font-weight:400;padding:12px 18px;cursor:pointer;
    border-bottom:3px solid transparent;letter-spacing:.3px;transition:.15s}
  nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--lightblue);font-weight:500}

  /* KPI STRIP */
  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px 26px 4px;
    max-width:1600px;margin:0 auto;width:100%}
  .kpi{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 15px;
    cursor:pointer;transition:.15s;border-left:4px solid var(--blue)}
  .kpi:hover{box-shadow:0 3px 10px rgba(0,0,0,.08);transform:translateY(-1px)}
  .kpi.sel{box-shadow:0 0 0 2px var(--blue) inset}
  .kpi .num{font-family:'Rufina',serif;font-size:25px;font-weight:700;color:var(--navy);line-height:1}
  .kpi .lbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .kpi.k-done{border-left-color:var(--done)}.kpi.k-prog{border-left-color:var(--blue)}
  .kpi.k-pend{border-left-color:var(--text2)}.kpi.k-late{border-left-color:var(--late)}
  .kpi.k-parcial{border-left-color:var(--warn)}.kpi.k-nao{border-left-color:var(--late)}
  .kpi.k-doc{border-left-color:var(--teal)}.kpi.k-sim{border-left-color:var(--done)}

  .overall{max-width:1600px;margin:6px auto 0;padding:4px 26px 0;width:100%}
  .prog-wrap{background:#E4E9ED;border-radius:20px;height:11px;overflow:hidden}
  .prog-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--done));width:0;transition:width .5s}
  .prog-cap{font-size:11px;color:var(--text2);margin-top:4px;display:flex;justify-content:space-between}

  /* TOOLBAR */
  .toolbar{max-width:1600px;margin:14px auto 0;padding:0 26px;width:100%;
    display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .toolbar input[type=text],.toolbar select{font-family:'Roboto';font-size:13px;font-weight:300;
    color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 11px;background:#fff}
  .toolbar input[type=text]{min-width:210px;flex:1}
  .btn{font-family:'Roboto';font-size:12.5px;font-weight:400;cursor:pointer;border:1px solid var(--blue);
    background:var(--blue);color:#fff;padding:8px 14px;border-radius:6px;transition:.15s;letter-spacing:.3px;white-space:nowrap}
  .btn:hover{background:var(--navy);border-color:var(--navy)}
  .btn.ghost{background:#fff;color:var(--blue)}.btn.ghost:hover{background:var(--bg-soft);color:var(--navy)}
  .btn.wine{background:var(--wine);border-color:var(--wine)}.btn.wine:hover{background:#5c0030;border-color:#5c0030}
  .hidden{display:none!important}

  main{max-width:1600px;margin:0 auto;padding:18px 26px 60px;width:100%}

  /* ===== PROCESSOS (catalogo) ===== */
  .module{margin-top:22px}
  .module-head{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:8px 8px 0 0;color:#fff;cursor:pointer;user-select:none}
  .module-head .mcode{font-weight:500;font-size:12px;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:4px}
  .module-head h2{font-size:16px;font-weight:700;flex:1;line-height:1.15}
  .module-head .mcount{font-size:12px;font-weight:400;opacity:.92}
  .module-head .chev{transition:.2s}.module.collapsed .chev{transform:rotate(-90deg)}
  .mh-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;font-family:'Roboto';
    font-size:11.5px;font-weight:400;padding:4px 9px;border-radius:5px;cursor:pointer;line-height:1}
  .mh-btn:hover{background:rgba(255,255,255,.32)}
  .module-mini{height:5px;background:#E4E9ED}.module-mini>span{display:block;height:100%;background:rgba(255,255,255,.9);width:0;transition:width .4s}
  .module-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px;
    padding:15px;background:#fff;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px}
  .module.collapsed .module-body,.module.collapsed .module-mini{display:none}
  .card{border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:7px;background:#fff;overflow:hidden;transition:.15s}
  .card:hover{box-shadow:0 3px 12px rgba(0,0,0,.09)}.card.custom{border-left-style:dashed}
  .card-head{padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .code-badge{font-weight:500;font-size:10.5px;color:#fff;background:var(--blue);padding:3px 8px;border-radius:4px;letter-spacing:.4px;flex:none}
  .pills{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
  .pill{font-size:10px;font-weight:400;padding:2px 8px;border-radius:11px;letter-spacing:.3px;white-space:nowrap}
  .pill.temos-sim{background:#E3F1E4;color:var(--done)}.pill.temos-parcial{background:#FBF3DF;color:var(--warn)}
  .pill.temos-nao{background:#F5E5E1;color:var(--late)}.pill.st{background:#EAF4FB;color:var(--navy)}
  .pill.cnt{background:#EEF2F5;color:var(--text2)}
  .card .name-primary{font-size:14px;font-weight:500;color:var(--text);line-height:1.25}
  .card .name-sec{font-size:11.5px;color:var(--text2);line-height:1.3}
  .card .name-sec b{font-weight:500;color:#7a7a7a;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;margin-right:4px}
  .card .flag{font-size:11px;color:var(--navy);margin-top:2px}
  .editor{display:none;padding:0 13px 13px;border-top:1px dashed var(--border);margin-top:2px}
  .card.open .editor{display:block}.card.open .card-head{padding-bottom:6px}
  .fld{margin-top:10px}.fld label{display:block;font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:4px}
  .fld input,.fld select,.fld textarea{width:100%;font-family:'Roboto';font-size:12.5px;font-weight:300;color:var(--text);border:1px solid var(--border);border-radius:5px;padding:7px 9px;background:#fff}
  .fld textarea{resize:vertical;min-height:48px;line-height:1.4}
  .fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .editor-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
  .del-btn{font-size:11.5px;color:var(--late);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:'Roboto'}
  .mini-btn{font-family:'Roboto';font-size:11.5px;cursor:pointer;border:1px solid var(--teal);background:#fff;color:var(--teal);padding:5px 10px;border-radius:5px}
  .mini-btn:hover{background:var(--teal);color:#fff}
  .edited-tag{font-size:10.5px;color:var(--teal);font-style:italic}
  .empty{padding:36px;text-align:center;color:var(--text2);font-size:14px}

  /* ===== MONTH NAV (tracking) ===== */
  .month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 16px}
  .month-nav button{background:#fff;border:1px solid var(--border);color:var(--navy);width:34px;height:34px;
    border-radius:50%;cursor:pointer;font-size:16px;line-height:1}
  .month-nav button:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
  .month-nav .mlabel{font-family:'Rufina',serif;font-size:20px;font-weight:700;color:var(--navy);min-width:220px;text-align:center;text-transform:capitalize}
  /* botao "Assumir mes" — escapa do estilo circular do .month-nav button */
  .month-nav .period-btn{width:auto;height:34px;border-radius:17px;padding:0 15px;font-family:'Roboto';
    font-size:12.5px;font-weight:500;border:1px solid var(--blue);background:#fff;color:var(--blue);letter-spacing:.3px;cursor:pointer}
  .month-nav .period-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
  .month-nav .period-active{font-family:'Roboto';font-size:12px;font-weight:500;color:var(--done);
    background:#E3F1E4;border:1px solid #BFE3C2;border-radius:17px;padding:6px 13px;letter-spacing:.3px;white-space:nowrap;cursor:default}

  /* ===== TIMELINE ===== */
  .timeline{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
  .day{width:52px;height:52px;background:#fff;border:2px solid var(--blue);border-radius:50%;display:flex;
    flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:500;color:var(--blue);transition:.15s;position:relative}
  .day .dn{font-family:'Rufina',serif;font-size:16px;line-height:1}
  .day .dc{font-size:9px;color:var(--text2);margin-top:1px}
  .day:hover{background:var(--blue);color:#fff}.day:hover .dc{color:#fff}
  .day.sel{background:var(--blue);color:#fff}.day.sel .dc{color:#fff}
  .day.today{box-shadow:0 0 0 3px rgba(0,131,202,.28)}
  .day.sat{border-color:var(--lightblue)}.day.sun{border-color:var(--rust)}
  .day.alldone{background:linear-gradient(135deg,var(--done),var(--done-dk))!important;border-color:var(--done-dk)!important;color:#fff!important}
  .day.alldone .dc{color:#fff!important}
  .day.hasitem::after{content:'';position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--rust)}
  .day.alldone.hasitem::after{background:#fff}
  .day.dragover{background:var(--lightblue)!important;color:#003C64!important;transform:scale(1.06)}

  .daypanel{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px}
  .daypanel h3{font-size:16px;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .case-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-left:4px solid var(--blue);
    border-radius:6px;margin-bottom:8px;background:#fff;cursor:grab}
  .case-row:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .case-row.dragging{opacity:.45}
  .case-row .ccode{font-size:10px;font-weight:500;color:#fff;background:var(--navy);padding:2px 7px;border-radius:4px;flex:none}
  .case-row .ctit{flex:1;font-size:13px;color:var(--text);min-width:0;overflow-wrap:anywhere}
  .case-row .cresp{font-size:11.5px;color:var(--text2)}
  .case-row .cstat{font-size:10px;padding:2px 9px;border-radius:11px;white-space:nowrap;color:#fff}
  /* linha inteira verde quando o caso esta concluido */
  .case-row.done{background:#EAF6EC;border-color:var(--done);border-left-color:var(--done)!important}
  .case-row.done .ctit{color:var(--done-dk);text-decoration:line-through;text-decoration-color:var(--done)}
  .case-row.done .ccode{background:var(--done-dk)}
  .case-row.done .cresp{color:#4C7A4F}
  /* destaque momentaneo ao chegar pela Linha do Tempo vindo do Fluxo */
  @keyframes rowflash{0%{box-shadow:0 0 0 0 rgba(0,131,202,.55)}70%{box-shadow:0 0 0 7px rgba(0,131,202,.10)}100%{box-shadow:0 0 0 7px rgba(0,131,202,0)}}
  .case-row.flash{animation:rowflash 1.3s ease-out 1;border-color:var(--blue)}

  /* ===== CALENDAR ===== */
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:11.5px;align-items:center;color:var(--text2)}
  .leg-item{display:flex;align-items:center;gap:5px}.leg-dot{width:12px;height:12px;border-radius:3px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .cal-dow{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);text-align:center;padding:4px 0}
  .cal-cell{min-height:96px;min-width:0;background:#fff;border:1px solid var(--border);border-radius:6px;padding:5px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .cal-cell.empty{background:transparent;border:none}
  .cal-cell.today{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
  .cal-cell.sat{background:#F4F9FC}.cal-cell.sun{background:#FBF3F1}
  .cal-cell.dragover{background:var(--lightblue)}
  .cal-daynum{font-size:11px;font-weight:500;color:var(--text2);align-self:flex-end}
  .cal-cell.today .cal-daynum{color:var(--blue)}
  .chip{font-size:10.5px;color:#fff;background:var(--blue);border-radius:4px;padding:3px 6px;cursor:grab;
    line-height:1.25;display:flex;align-items:center;gap:4px;position:relative;max-width:100%;overflow:hidden}
  .chip.light{color:#003C64}.chip.dragging{opacity:.45}
  .chip .chdot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.7);cursor:pointer;flex:none}
  .chip .chtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .chip .mbadge{font-size:8.5px;font-weight:600;background:rgba(255,255,255,.85);color:#003C64;border-radius:3px;padding:0 3px;line-height:1.4;flex:none}
  .chip.light .mbadge{background:#003C64;color:#fff}
  .chip .chx{flex:none;cursor:pointer;font-size:12px;line-height:1;opacity:.75;padding:0 1px}
  .chip .chx:hover{opacity:1}
  .chip.hiddencal{opacity:.5}
  .chip.hiddencal .chtxt{text-decoration:line-through}
  .cal-add{font-size:16px;color:var(--text2);cursor:pointer;text-align:center;opacity:0;transition:.15s}
  .cal-cell:hover .cal-add{opacity:.7}

  /* ===== KANBAN ===== */
  .kb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .kb-col{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;min-height:120px}
  .kb-col.dragover{background:#EAF4FB;border-color:var(--blue)}
  .kb-col h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid}
  .kb-col .kcount{margin-left:auto;font-size:12px;font-weight:400;color:var(--text2)}
  .kb-card{border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:6px;padding:10px;margin-bottom:9px;background:#fff;cursor:grab;overflow:hidden}
  .kb-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.09)}.kb-card.dragging{opacity:.45}
  .kb-card .kcode{font-size:10px;font-weight:500;color:#fff;background:var(--navy);padding:2px 7px;border-radius:4px}
  .kb-card .ktit{font-size:13px;color:var(--text);margin-top:6px;line-height:1.3;overflow-wrap:anywhere}
  .kb-card .kmeta{font-size:11px;color:var(--text2);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
  .kb-card.late{border-left-color:var(--late)}
  .kb-card .kb-link{margin-top:8px;display:inline-flex;align-items:center;gap:4px;font-size:11px;
    color:var(--blue);background:transparent;border:1px solid var(--blue);border-radius:5px;
    padding:3px 9px;cursor:pointer;font-family:'Roboto';font-weight:400;letter-spacing:.2px}
  .kb-card .kb-link:hover{background:var(--blue);color:#fff}

  /* ===== GANTT ===== */
  .gantt-wrap{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto}
  table.gantt{border-collapse:collapse;width:100%;font-size:11px}
  table.gantt th,table.gantt td{border:1px solid #E4E9ED;padding:0;text-align:center;height:26px}
  table.gantt th.glabel,table.gantt td.glabel{text-align:left;padding:4px 8px;min-width:230px;font-size:12px;position:sticky;left:0;background:#fff;z-index:2}
  table.gantt th{background:var(--bg-soft);color:var(--navy);font-weight:500;min-width:22px}
  table.gantt th.wknd{background:#EAF1F5}
  table.gantt td.gcell{min-width:22px}
  table.gantt td.gcell.wknd{background:#F7FAFB}
  table.gantt td.gcell.today{box-shadow:0 0 0 2px var(--blue) inset}
  .gbar{height:15px;border-radius:4px;background:var(--blue);margin:auto;cursor:pointer}
  .gproc{font-weight:500;color:var(--navy)}.gtit{color:var(--text2)}

  /* ===== MODAL ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(0,20,40,.42);display:none;align-items:center;justify-content:center;z-index:120;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:10px;width:100%;max-width:520px;max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .modal-head{background:var(--blue);color:#fff;padding:13px 18px;font-family:'Rufina',serif;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .modal-head .x{cursor:pointer;font-size:20px;line-height:1;background:none;border:none;color:#fff}
  .modal-body{padding:16px 18px}
  .modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
  .sw{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent}
  .sw.sel{border-color:#333;box-shadow:0 0 0 2px #fff inset}
  .sw.none{background:#fff;border:1px dashed var(--border);color:var(--text2);font-size:10px;display:flex;align-items:center;justify-content:center}

  /* bulk modal list */
  .bulk-list{max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:6px;padding:8px;margin-top:8px}
  .bulk-day{font-size:11px;font-weight:500;color:var(--navy);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.4px}
  .bulk-item{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:12.5px;border-bottom:1px solid #eef2f5}
  .bulk-item input{width:16px;height:16px}

  footer.botbar{background:var(--blue);color:#fff;padding:12px 26px;margin-top:26px;display:flex;
    justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px}
  footer.botbar b{font-weight:500}footer.botbar .fr{opacity:.9;font-weight:300}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);
    color:#fff;padding:11px 22px;border-radius:7px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.25);
    opacity:0;transition:.3s;z-index:200;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden;display:none}
  .conf{position:absolute;width:9px;height:14px;top:-20px;opacity:.95;border-radius:1px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}

let LANG='pt';
let VIEW='processos';
let state={catalog:[],cases:[],collapsed:{},periodo:null};
const filters={search:'',mod:'',temos:'',status:'',cstatus:''};

/* ===================== PERSISTENCIA ===================== */
let STORAGE_OK=true, _warnedStorage=false;
const MSG_NOSTORE={
  pt:'Atenção: o navegador está bloqueando o armazenamento local. Os dados NÃO serão mantidos ao recarregar. Use "Backup JSON" para salvar e "Importar" para restaurar. (Rode o arquivo baixado diretamente no navegador, fora do preview.)',
  en:'Warning: the browser is blocking local storage. Data will NOT persist on reload. Use "Backup JSON" to save and "Import" to restore. (Open the downloaded file directly in the browser, outside the preview.)',
  es:'Atención: el navegador está bloqueando el almacenamiento local. Los datos NO se mantendrán al recargar. Use "Backup JSON" para guardar e "Importar" para restaurar. (Abra el archivo descargado directamente en el navegador, fuera del preview.)'
};
function storageAvailable(){
  try{const k='__sonova_probe__';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}
  catch(e){return false;}
}
function warnNoStorage(){STORAGE_OK=false;if(_warnedStorage)return;_warnedStorage=true;
  const el=document.getElementById('toast');el.textContent=MSG_NOSTORE[LANG]||MSG_NOSTORE.pt;
  el.style.maxWidth='680px';el.style.background='#8C321E';el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>{el.classList.remove('show');el.style.background='';el.style.maxWidth='';},7000);}
function persist(){
  try{const p=JSON.stringify(state);localStorage.setItem(LS_MAIN,p);localStorage.setItem(LS_BKP,p);STORAGE_OK=true;}
  catch(e){
    if(e&&(e.name==='QuotaExceededError'||e.code===22)){toast(t('quota'));}
    else{warnNoStorage();}
  }
}
function loadState(){
  let raw=null;try{raw=localStorage.getItem(LS_MAIN);}catch(e){}
  if(!raw){try{raw=localStorage.getItem(LS_BKP);}catch(e){}}
  if(raw){try{const p=JSON.parse(raw);
    if(p&&Array.isArray(p.catalog)&&p.catalog.length){
      state={catalog:p.catalog,cases:Array.isArray(p.cases)?p.cases:[],collapsed:p.collapsed||{},
        modules:(Array.isArray(p.modules)&&p.modules.length)?p.modules:seedModules(),periodo:p.periodo||null};
      state.cases.forEach(c=>{if(!c.id)c.id=uid();});
      normalizeModules();normalizeCases();
      return;}
  }catch(e){}}
  state={catalog:SEED.map(seedToItem),cases:[],collapsed:{},modules:seedModules(),periodo:null};
}
function seedModules(){return DEFAULT_MODULES.map(m=>({id:m.id,en:m.en,pt:m.pt,es:m.es,color:MOD_COLOR[m.id]||'#0083CA',custom:false}));}
function normalizeModules(){
  if(!Array.isArray(state.modules)||!state.modules.length)state.modules=seedModules();
  state.modules.forEach(m=>{if(!m.color)m.color=MOD_COLOR[m.id]||'#0083CA';
    if(m.en==null)m.en=m.pt||m.id;if(m.pt==null)m.pt=m.en||m.id;if(m.es==null)m.es=m.pt||m.id;});
}
function normalizeCases(){
  const arr=Array.isArray(state.cases)?state.cases:[];
  const seen={},out=[];
  arr.forEach(c=>{
    if(!c.id)c.id=uid();
    if(seen[c.id])return; // remove duplicata exata por id
    seen[c.id]=1;
    if(c.recorrente===undefined)c.recorrente=/recorrente\s+mensal/i.test(c.obs||'');
    out.push(c);
  });
  state.cases=out;
}
function seedToItem(s){return{code:s.code,mod:s.mod,en:s.en,pt:s.pt,es:s.es,temos:'nao',status:'nao_mapeado',
  owner:'',notes:'',custom:false,edited:false,oen:s.en,opt:s.pt,oes:s.es};}

/* ===================== HELPERS ===================== */
function t(k){return (I18N[LANG]&&I18N[LANG][k])||(I18N.pt[k]||k);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function statusLabel(v){const o=STATUS_OPTS.find(x=>x.v===v);return o?o[LANG]:v;}
function temosLabel(v){const o=TEMOS_OPTS.find(x=>x.v===v);return o?o[LANG]:v;}
function csObj(v){return CASE_STATUS.find(x=>x.v===v)||CASE_STATUS[0];}
function csLabel(v){return csObj(v)[LANG];}
function modObj(id){return state.modules.find(x=>x.id===id);}
function modName(id){const m=modObj(id);return m?m[LANG]:id;}
function procByCode(code){return state.catalog.find(x=>x.code===code);}
function palByV(v){return PALETTE.find(p=>p.v===v)||PALETTE[0];}
function langOrder(){return LANG==='pt'?['pt','en','es']:LANG==='en'?['en','pt','es']:['es','en','pt'];}
function langTag(l){return l==='pt'?'PT':l==='en'?'EN':'ES';}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1900);}
function pad(n){return String(n).padStart(2,'0');}
function ymd(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}
function todayYMD(){const d=new Date();return ymd(d.getFullYear(),d.getMonth(),d.getDate());}
function parseYMD(s){if(!s)return null;const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function isLate(c){if(c.status==='concluido')return false;const d=parseYMD(c.dateFim||c.date);if(!d)return false;const today=parseYMD(todayYMD());return d<today;}
function monthLabel(y,m){return new Date(y,m,1).toLocaleDateString(LANG==='pt'?'pt-BR':LANG==='es'?'es-ES':'en-US',{month:'long',year:'numeric'});}
function caseColor(c){if(c.cor){const p=palByV(c.cor);if(p.hex)return p.hex;}return csObj(c.status).color;}
function isLightColor(hex){return hex==='#6EB4DC';}

/* ===================== RENDER ROUTER ===================== */
function render(){
  applyChrome();
  document.querySelectorAll('.proc-only').forEach(e=>e.classList.toggle('hidden',VIEW!=='processos'));
  document.querySelectorAll('.track-only').forEach(e=>e.classList.toggle('hidden',VIEW==='processos'));
  document.getElementById('addProcBtn').classList.toggle('hidden',VIEW!=='processos');
  document.getElementById('addCaseBtn').classList.toggle('hidden',VIEW==='processos');
  document.getElementById('overall').style.display='block';
  buildKPIs();
  const app=document.getElementById('app');app.innerHTML='';
  if(VIEW==='processos')renderProcessos(app);
  else if(VIEW==='timeline')renderTimeline(app);
  else if(VIEW==='calendario')renderCalendario(app);
  else if(VIEW==='kanban')renderKanban(app);
  else if(VIEW==='gantt')renderGantt(app);
  checkAllDone();
}

/* ===================== KPIs ===================== */
function buildKPIs(){
  const strip=document.getElementById('kpiStrip');
  const progBar=document.getElementById('progBar'),progLbl=document.getElementById('progLbl'),progTxt=document.getElementById('progTxt');
  if(VIEW==='processos'){
    const it=state.catalog,total=it.length;
    const sim=it.filter(x=>x.temos==='sim').length,parc=it.filter(x=>x.temos==='parcial').length,nao=it.filter(x=>x.temos==='nao').length;
    const doc=it.filter(x=>x.status==='documentado'||x.status==='validado').length;
    strip.innerHTML=
      kpiCard('total','k-total',total,t('k_total'))+kpiCard('sim','k-sim',sim,t('k_sim'))+
      kpiCard('parcial','k-parcial',parc,t('k_parcial'))+kpiCard('nao','k-nao',nao,t('k_nao'))+
      kpiCard('doc','k-doc',doc,t('k_doc'));
    const pct=total?Math.round(doc/total*100):0;
    progBar.style.width=pct+'%';progLbl.textContent=t('prog_proc');progTxt.textContent=pct+'% ('+doc+'/'+total+')';
  }else{
    const cs=state.cases,total=cs.length;
    const done=cs.filter(c=>c.status==='concluido').length,prog=cs.filter(c=>c.status==='andamento').length;
    const pend=cs.filter(c=>c.status==='pendente').length,late=cs.filter(isLate).length;
    strip.innerHTML=
      kpiCard('ctotal','k-prog',total,t('c_total'))+kpiCard('cdone','k-done',done,t('c_done'))+
      kpiCard('cprog','k-prog',prog,t('c_prog'))+kpiCard('cpend','k-pend',pend,t('c_pend'))+
      kpiCard('clate','k-late',late,t('c_late'));
    const pct=total?Math.round(done/total*100):0;
    progBar.style.width=pct+'%';progLbl.textContent=t('prog_case');progTxt.textContent=pct+'% ('+done+'/'+total+')';
  }
  strip.querySelectorAll('.kpi').forEach(k=>k.addEventListener('click',()=>onKpi(k.dataset.k)));
}
function kpiCard(key,cls,num,lbl){return '<div class="kpi '+cls+(kpiSel(key)?' sel':'')+'" data-k="'+key+'"><div class="num">'+num+'</div><div class="lbl">'+esc(lbl)+'</div></div>';}
function kpiSel(key){
  if(VIEW==='processos'){if(key==='sim'||key==='parcial'||key==='nao')return filters.temos===key;if(key==='doc')return filters.status==='documentado';return false;}
  else{if(key==='cdone')return filters.cstatus==='concluido';if(key==='cprog')return filters.cstatus==='andamento';if(key==='cpend')return filters.cstatus==='pendente';if(key==='clate')return filters.cstatus==='atrasado';return false;}
}
function onKpi(key){
  if(VIEW==='processos'){
    if(key==='total'){filters.temos='';filters.status='';}
    else if(['sim','parcial','nao'].includes(key)){filters.temos=filters.temos===key?'':key;filters.status='';}
    else if(key==='doc'){filters.status=filters.status==='documentado'?'':'documentado';filters.temos='';}
    syncFilterSelects();
  }else{
    const map={cdone:'concluido',cprog:'andamento',cpend:'pendente',clate:'atrasado'};
    if(key==='ctotal')filters.cstatus='';
    else if(map[key])filters.cstatus=filters.cstatus===map[key]?'':map[key];
    document.getElementById('fCaseStatus').value=filters.cstatus;
  }
  render();
}

/* ===================== PROCESSOS ===================== */
function passProc(it){
  if(filters.mod&&it.mod!==filters.mod)return false;
  if(filters.temos&&it.temos!==filters.temos)return false;
  if(filters.status&&it.status!==filters.status)return false;
  if(filters.search){const q=filters.search.toLowerCase();
    if(!(it.code+' '+it.en+' '+it.pt+' '+it.es+' '+it.owner+' '+it.notes).toLowerCase().includes(q))return false;}
  return true;
}
function renderProcessos(app){
  const order=langOrder();let any=false;
  state.modules.forEach(m=>{
    const tot=state.catalog.filter(it=>it.mod===m.id).length;
    const items=state.catalog.filter(it=>it.mod===m.id&&passProc(it));
    if(!items.length&&tot>0)return; // filtro escondeu todos deste modulo
    any=true;
    const color=m.color||MOD_COLOR[m.id]||'#0083CA',collapsed=!!state.collapsed[m.id];
    const done=state.catalog.filter(it=>it.mod===m.id&&(it.status==='documentado'||it.status==='validado')).length;
    const pct=tot?Math.round(done/tot*100):0;
    const sec=document.createElement('section');sec.className='module'+(collapsed?' collapsed':'');
    const head=document.createElement('div');head.className='module-head';head.style.background=color;
    head.innerHTML='<span class="mcode">'+esc(m.id)+'</span><h2>'+esc(m[LANG])+'</h2><span class="mcount">'+items.length+' / '+tot+' &middot; '+pct+'%</span>'+
      '<button class="mh-btn" data-act="addproc" title="'+t('add_proc_here')+'">'+t('add_proc_here')+'</button>'+
      '<button class="mh-btn" data-act="editmod" title="'+t('mod_edit')+'">&#9998;</button>'+
      '<span class="chev">&#9660;</span>';
    head.addEventListener('click',e=>{
      const b=e.target.closest('[data-act]');
      if(b){e.stopPropagation();if(b.dataset.act==='addproc')addProcess(m.id);else openModuleModal(m.id);return;}
      state.collapsed[m.id]=!collapsed;persist();render();
    });
    const mini=document.createElement('div');mini.className='module-mini';mini.innerHTML='<span style="width:'+pct+'%"></span>';
    const body=document.createElement('div');body.className='module-body';
    if(!items.length){const e=document.createElement('div');e.className='empty';e.style.gridColumn='1/-1';e.style.padding='18px';e.textContent=t('empty_module');body.appendChild(e);}
    items.forEach(it=>body.appendChild(buildProcCard(it,color,order)));
    sec.appendChild(head);sec.appendChild(mini);sec.appendChild(body);app.appendChild(sec);
  });
  if(!any){const e=document.createElement('div');e.className='empty';e.textContent=t('empty_proc');app.appendChild(e);}
}

  ed.querySelectorAll('[data-f]').forEach(inp=>{

      liveProc(card,it);clearTimeout(saveTimer);saveTimer=setTimeout(()=>{persist();buildKPIs();toast(t('saved'));},500);};

/* ===================== CASOS: filtro comum ===================== */
function passCase(c){
  if(filters.cstatus){if(filters.cstatus==='atrasado'){if(!isLate(c))return false;}else if(c.status!==filters.cstatus)return false;}
  if(filters.search){const q=filters.search.toLowerCase();const proc=procByCode(c.proc);
    const blob=((c.proc||'')+' '+(c.titulo||'')+' '+(c.resp||'')+' '+(c.obs||'')+' '+(proc?proc[LANG]:'')).toLowerCase();
    if(!blob.includes(q))return false;}
  return true;
}
function caseLabel(c){const proc=procByCode(c.proc);const nm=proc?proc[LANG]:(c.proc||'');return (c.titulo&&c.titulo.trim())?c.titulo:nm;}

/* ===================== TIMELINE ===================== */
function renderTimeline(app){
  app.appendChild(monthNav());
  const dim=new Date(curYear,curMonth+1,0).getDate();
  const tl=document.createElement('div');tl.className='timeline';
  for(let d=1;d<=dim;d++){
    const dateStr=ymd(curYear,curMonth,d);const wd=new Date(curYear,curMonth,d).getDay();
    const dayCases=state.cases.filter(c=>c.date===dateStr&&passCase(c));
    const allDone=dayCases.length>0&&dayCases.every(c=>c.status==='concluido');
    const cell=document.createElement('div');
    cell.className='day'+(wd===6?' sat':'')+(wd===0?' sun':'')+(dateStr===todayYMD()?' today':'')+(dateStr===selDay?' sel':'')+(dayCases.length?' hasitem':'')+(allDone?' alldone':'');
    cell.innerHTML='<span class="dn">'+d+'</span>'+(dayCases.length?'<span class="dc">'+dayCases.length+'</span>':'<span class="dc">&nbsp;</span>');
    cell.addEventListener('click',()=>{selDay=dateStr;render();});

  app.appendChild(tl);

  const panel=document.createElement('div');panel.className='daypanel';

function monthNav(){
  const nav=document.createElement('div');nav.className='month-nav';
  const isActive=(state.periodo===periodKey(curYear,curMonth));
  const tail=isActive
    ? '<span class="period-active" title="'+esc(t('period_active_tip'))+'">&#9679; '+esc(t('period_active'))+'</span>'
    : '<button id="mAssume" class="period-btn" title="'+esc(t('period_active_tip'))+'">'+esc(t('assume_btn'))+'</button>';
  nav.innerHTML='<button id="mPrev">&#8249;</button><span class="mlabel">'+esc(monthLabel(curYear,curMonth))+'</span><button id="mNext">&#8250;</button>'+tail;
  nav.querySelector('#mPrev').addEventListener('click',()=>{curMonth--;if(curMonth<0){curMonth=11;curYear--;}render();});
  nav.querySelector('#mNext').addEventListener('click',()=>{curMonth++;if(curMonth>11){curMonth=0;curYear++;}render();});
  const asm=nav.querySelector('#mAssume');if(asm)asm.addEventListener('click',()=>assumeMonth(curYear,curMonth));
  return nav;
}

/* ===================== VIRADA DE MES (recorrentes) =====================
   Casos recorrentes mensais tem um unico status; ao abrir um novo mes de
   referencia, os que estao "concluido" voltam para "pendente" para o novo
   ciclo. Tarefas de data unica nao sao afetadas (mantem o historico).
   - Automatico: toda vez que o app abre num mes-calendario a frente do
     mes de referencia salvo (state.periodo).
   - Manual: botao "Assumir mes" para meses atipicos (ex.: virar setembro
     antes/depois da data, ou reabrir o ciclo sob demanda).                 */
function periodKey(y,m){return y+'-'+pad(m+1);}
function currentPeriodKey(){const d=new Date();return periodKey(d.getFullYear(),d.getMonth());}
function labelFromKey(k){const p=String(k||'').split('-');return monthLabel(+p[0],(+p[1])-1);}
function resetRecurringDone(){let n=0;state.cases.forEach(c=>{if(c.recorrente&&c.status==='concluido'){c.status='pendente';n++;}});return n;}
/* Chamado no init. Retorna a mensagem de toast (ou null) para exibir apos o render. */
function monthlyRolloverCheck(){
  const cur=currentPeriodKey();
  if(!state.periodo){state.periodo=cur;persist();return null;}     // primeira marcacao, sem reset
  if(cur>state.periodo){                                            // 'YYYY-MM' compara certo, inclusive virada de ano
    const n=resetRecurringDone();
    state.periodo=cur;
    allDoneFlag=(state.cases.length>0&&state.cases.every(c=>c.status==='concluido'));
    persist();
    return t('rollover_toast').replace('{m}',labelFromKey(cur)).replace('{n}',n);
  }
  return null;
}
/* Assume manualmente o mes visualizado como mes de referencia e reabre os recorrentes concluidos. */
function assumeMonth(y,m){
  const key=periodKey(y,m),label=monthLabel(y,m);
  const n=state.cases.filter(c=>c.recorrente&&c.status==='concluido').length;
  const msg=(n>0?t('assume_confirm'):t('assume_confirm_zero')).replace('{m}',label).replace('{n}',n);
  if(!confirm(msg))return;
  resetRecurringDone();
  state.periodo=key;curYear=y;curMonth=m;selDay=ymd(y,m,1);
  allDoneFlag=(state.cases.length>0&&state.cases.every(c=>c.status==='concluido'));
  persist();render();
  toast((n>0?t('assume_done'):t('assume_done_zero')).replace('{m}',label).replace('{n}',n));
}

  document.getElementById('caseModalTitle').textContent=isNew?t('cm_new'):t('cm_edit');

function renderBulkList(){

function addStyledSheet(wb,name,rows,widths){
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=widths.map(w=>({wch:w}));ws['!rows']=[{hpt:22}];
  const rg=XLSX.utils.decode_range(ws['!ref']);
  for(let R=rg.s.r;R<=rg.e.r;R++)for(let C=rg.s.c;C<=rg.e.c;C++){
    const ref=XLSX.utils.encode_cell({r:R,c:C});if(!ws[ref])continue;const head=R===0;
    ws[ref].s={font:{name:'Calibri Light',sz:8,bold:head,color:{rgb:head?'FFFFFF':'333333'}},
      fill:head?{fgColor:{rgb:'0083CA'}}:{fgColor:{rgb:'FFFFFF'}},
      alignment:{vertical:'top',horizontal:'left',wrapText:true},
      border:{top:{style:'thin',color:{rgb:'CCCCCC'}},bottom:{style:'thin',color:{rgb:'CCCCCC'}},left:{style:'thin',color:{rgb:'CCCCCC'}},right:{style:'thin',color:{rgb:'CCCCCC'}}}};
  }
  XLSX.utils.book_append_sheet(wb,ws,name);
}

/* --- Conversao do backup linhatempo (Gerenciador RH - PMO Sonova) --- */
const LT_COR={azul:'blue',escuro:'navy',petroleo:'teal',claro:'light',bordo:'wine','bordô':'wine',terracota:'rust',
  blue:'blue',navy:'navy',teal:'teal',light:'light',wine:'wine',rust:'rust'};
function ltStatus(s){s=String(s||'').toLowerCase();if(s.indexOf('conclu')===0||s.indexOf('conclu')>-1&&s.indexOf('nao')<0)return 'concluido';if(s.indexOf('andam')>-1||s.indexOf('progres')>-1||s.indexOf('curso')>-1)return 'andamento';return 'pendente';}
function ltCollapse(s){return String(s||'').replace(/\s*\n+\s*/g,' · ').replace(/\s{2,}/g,' ').trim();}
function ltObs(a,extra){const p=[];if(a.obs)p.push(String(a.obs).trim());
  if(a.prioridade&&a.prioridade!=='Média'&&a.prioridade!=='Media')p.push('Prioridade: '+a.prioridade);
  if(a.depende)p.push('Depende: '+a.depende);if(extra)p.push(extra);return p.join(' · ');}
function isYMD(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||''));}
function convertLinhatempo(p){
  const out=[];
  const ad=p.activityData||{};
  Object.keys(ad).forEach(dayKey=>{(Array.isArray(ad[dayKey])?ad[dayKey]:[]).forEach(a=>{
    let date=a.inicio||'';
    if(!isYMD(date)){const dnum=parseInt(dayKey,10);if(dnum)date=ymd(curYear,curMonth,dnum);else return;}
    const fim=(a.fim&&a.fim!==a.inicio&&isYMD(a.fim))?a.fim:'';
    out.push({id:a.id||uid(),proc:'',titulo:ltCollapse(a.text)||t('new_case'),date:date,dateFim:fim,
      status:ltStatus(a.status),resp:String(a.responsavel||'').trim(),obs:ltObs(a,''),cor:LT_COR[String(a.cor||'').toLowerCase()]||'',recorrente:false,noCal:a.noCalendario===true});
  });});
  (Array.isArray(p.calendarioDireto)?p.calendarioDireto:[]).forEach(a=>{
    let date='';
    if(a.startYear!=null&&a.startMonth!=null&&a.day!=null)date=ymd(+a.startYear,+a.startMonth,+a.day);
    else if(isYMD(a.date))date=a.date;
    if(!isYMD(date))return;
    out.push({id:a.id||uid(),proc:'',titulo:ltCollapse(a.text)||t('new_case'),date:date,dateFim:'',
      status:ltStatus(a.status),resp:String(a.responsavel||'').trim(),obs:ltObs(a,a.recorrenteMensal?'Recorrente mensal':''),cor:LT_COR[String(a.cor||'').toLowerCase()]||'',recorrente:!!a.recorrenteMensal});
  });
  return out;
}
function mergeCases(nc){const byId={};state.cases.forEach(c=>byId[c.id]=c);let added=0,updated=0;
  nc.forEach(n=>{if(byId[n.id]){Object.assign(byId[n.id],n);updated++;}else{state.cases.push(n);byId[n.id]=n;added++;}});return{added,updated};}
function jumpToBusiestMonth(){const cnt={};state.cases.forEach(c=>{const d=parseYMD(c.date);if(d){const k=d.getFullYear()+'|'+d.getMonth();cnt[k]=(cnt[k]||0)+1;}});
  let best=null,bn=-1;Object.keys(cnt).forEach(k=>{if(cnt[k]>bn){bn=cnt[k];best=k;}});
  if(best){const pr=best.split('|');curYear=+pr[0];curMonth=+pr[1];selDay=ymd(curYear,curMonth,1);}}

function importJSON(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let p;
    try{p=JSON.parse(rd.result);}catch(e){toast(t('bad_file')+' (JSON)');return;}
    try{
      if(p&&Array.isArray(p.catalog)){
        state={catalog:p.catalog,cases:Array.isArray(p.cases)?p.cases:[],collapsed:p.collapsed||{},
          modules:(Array.isArray(p.modules)&&p.modules.length)?p.modules:seedModules(),periodo:p.periodo||currentPeriodKey()};
        state.cases.forEach(c=>{if(!c.id)c.id=uid();});normalizeModules();normalizeCases();
        allDoneFlag=(state.cases.length>0&&state.cases.every(c=>c.status==='concluido'));
        persist();render();toast(t('imported'));
      }else if(p&&(p.activityData||p.calendarioDireto)){
        const conv=convertLinhatempo(p);const res=mergeCases(conv);
        allDoneFlag=(state.cases.length>0&&state.cases.every(c=>c.status==='concluido'));
        jumpToBusiestMonth();VIEW='calendario';
        persist();render();
        toast(t('imported')+' · '+res.added+' '+String(t('c_total')).toLowerCase()+(res.updated?(' ('+res.updated+' '+t('edited')+')'):''));
      }else if(p&&Array.isArray(p.items)){
        state.catalog=p.items;state.collapsed=p.collapsed||{};persist();render();toast(t('imported'));
      }else{toast(t('bad_file'));}
    }catch(e){toast(t('bad_file')+' · '+(e&&e.message?e.message:''));}
  };
  rd.readAsText(file);
}

  const ML=[['lb_mcode','lb_mcode'],['lb_mpt','lb_mpt'],['lb_men','lb_men'],['lb_mes','lb_mes'],['lb_mcor','lb_mcor']];
  ML.forEach(([id,k])=>{const e=document.getElementById(id);if(e)e.textContent=t(k);});
  document.getElementById('mmSave').textContent=t('mm_save');document.getElementById('mmCancel').textContent=t('mm_cancel');document.getElementById('mmDel').textContent=t('mod_del');
}
function buildFilterSelects(){
  const fm=document.getElementById('fModule');
  fm.innerHTML='<option value="">'+t('f_all_mod')+'</option>'+state.modules.map(m=>'<option value="'+m.id+'"'+(filters.mod===m.id?' selected':'')+'>'+m.id+' · '+esc(m[LANG])+'</option>').join('');
  const ft=document.getElementById('fTemos');
  ft.innerHTML='<option value="">'+t('f_all_temos')+'</option>'+TEMOS_OPTS.map(o=>'<option value="'+o.v+'"'+(filters.temos===o.v?' selected':'')+'>'+esc(o[LANG])+'</option>').join('');
  const fs=document.getElementById('fStatus');
  fs.innerHTML='<option value="">'+t('f_all_status')+'</option>'+STATUS_OPTS.map(o=>'<option value="'+o.v+'"'+(filters.status===o.v?' selected':'')+'>'+esc(o[LANG])+'</option>').join('');
  const fc=document.getElementById('fCaseStatus');
  fc.innerHTML='<option value="">'+t('f_all_cstatus')+'</option>'+CASE_STATUS.map(o=>'<option value="'+o.v+'"'+(filters.cstatus===o.v?' selected':'')+'>'+esc(o[LANG])+'</option>').join('')+'<option value="atrasado"'+(filters.cstatus==='atrasado'?' selected':'')+'>'+esc(t('c_late'))+'</option>';
}
function syncFilterSelects(){document.getElementById('fTemos').value=filters.temos;document.getElementById('fStatus').value=filters.status;}

/* ===================== EVENTOS ===================== */
function bind(){
  document.querySelectorAll('#langSwitch button').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.lang;render();}));
  document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{VIEW=b.dataset.view;filters.search='';document.getElementById('search').value='';render();}));
  document.getElementById('search').addEventListener('input',e=>{filters.search=e.target.value.trim();render();});
  document.getElementById('fModule').addEventListener('change',e=>{filters.mod=e.target.value;render();});
  document.getElementById('fTemos').addEventListener('change',e=>{filters.temos=e.target.value;render();});
  document.getElementById('fStatus').addEventListener('change',e=>{filters.status=e.target.value;render();});
  document.getElementById('fCaseStatus').addEventListener('change',e=>{filters.cstatus=e.target.value;render();});
  document.getElementById('addProcBtn').addEventListener('click',()=>addProcess());
  document.getElementById('addModBtn').addEventListener('click',addModule);
  document.getElementById('mmSave').addEventListener('click',saveModuleModal);
  document.getElementById('mmCancel').addEventListener('click',closeModuleModal);
  document.getElementById('modModalX').addEventListener('click',closeModuleModal);
  document.getElementById('mmDel').addEventListener('click',deleteModule);
  document.getElementById('modModalBg').addEventListener('click',e=>{if(e.target.id==='modModalBg')closeModuleModal();});
  document.getElementById('addCaseBtn').addEventListener('click',()=>openCaseModal(null,{}));
  document.getElementById('bulkBtn').addEventListener('click',openBulk);
  document.getElementById('expandAll').addEventListener('click',()=>{state.modules.forEach(m=>state.collapsed[m.id]=false);persist();render();});
  document.getElementById('collapseAll').addEventListener('click',()=>{state.modules.forEach(m=>state.collapsed[m.id]=true);persist();render();});
  document.getElementById('xlsxBtn').addEventListener('click',exportExcel);
  document.getElementById('jsonBtn').addEventListener('click',exportJSON);
  document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value='';});
  document.getElementById('printBtn').addEventListener('click',()=>window.print());
  document.getElementById('resetBtn').addEventListener('click',resetDefault);
  // case modal
  document.getElementById('cmSave').addEventListener('click',saveCaseModal);
  document.getElementById('cmCancel').addEventListener('click',closeCaseModal);
  document.getElementById('caseModalX').addEventListener('click',closeCaseModal);
  document.getElementById('cmDel').addEventListener('click',deleteCase);
  document.getElementById('caseModalBg').addEventListener('click',e=>{if(e.target.id==='caseModalBg')closeCaseModal();});
  // bulk modal
  document.getElementById('bulkFilter').addEventListener('change',renderBulkList);
  document.getElementById('bulkSelVis').addEventListener('click',bulkSelectVisible);
  document.getElementById('bulkClear').addEventListener('click',bulkClearSel);
  document.getElementById('bulkMove').addEventListener('click',bulkMove);
  document.getElementById('bulkCancel').addEventListener('click',()=>document.getElementById('bulkModalBg').classList.remove('show'));
  document.getElementById('bulkX').addEventListener('click',()=>document.getElementById('bulkModalBg').classList.remove('show'));
  document.getElementById('bulkModalBg').addEventListener('click',e=>{if(e.target.id==='bulkModalBg')e.currentTarget.classList.remove('show');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCaseModal();closeModuleModal();document.getElementById('bulkModalBg').classList.remove('show');}});
}

/* ===================== INIT ===================== */
(function init(){
  const now=new Date();curYear=now.getFullYear();curMonth=now.getMonth();selDay=todayYMD();
  loadState();
  const rollMsg=monthlyRolloverCheck();                 // virada automatica de mes (recorrentes concluidos -> pendentes)
  allDoneFlag=(state.cases.length>0&&state.cases.every(c=>c.status==='concluido'));
  bind();render();
  if(rollMsg)setTimeout(()=>toast(rollMsg),450);
  if(!storageAvailable()){setTimeout(warnNoStorage,700);}
})();
</script>
